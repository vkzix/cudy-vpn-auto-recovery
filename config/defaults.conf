# Cudy VPN Auto Recovery defaults
# This file is installed as /etc/vpn-auto-recovery.conf.
# Values can be overridden in that file on the router.

CHECK_INTERVAL=30
MAX_FAILS=5
COOLDOWN=900

TUN_INTERFACE="singtun0"
HOMEPROXY_INIT="/etc/init.d/homeproxy"

# HomeProxy mixed proxy listener. Health checks go through this proxy.
PROXY_URL="http://127.0.0.1:5330"

# Recovery verification: 15 attempts x 4 seconds = up to 60 seconds.
RECOVERY_ATTEMPTS=15
RECOVERY_WAIT=4

# Initial checks in fix_vpn.sh before restarting HomeProxy.
PRE_RESTART_ATTEMPTS=3
PRE_RESTART_WAIT=3

# External HTTPS probes. Both are tested through the local mixed proxy.
PROBE_URL_1="https://api.ip.sb/geoip"
PROBE_URL_2="https://cp.cloudflare.com/generate_204"
CURL_CONNECT_TIMEOUT=5
CURL_MAX_TIME=10

# Game-port helper. Set ENABLE_GAME_PORT_RULES=0 to disable it.
ENABLE_GAME_PORT_RULES=1
GAME_TCP_PORTS="9339,5000-10000"
GAME_UDP_PORTS="9339,5000-10000"
